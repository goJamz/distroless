trufflehog:
  false_positives: []
  excluded_files: []
deployment_level: "PRODUCTION"
organization: "cdso"
security_group: "dami_im"

distroless:
  project_type: "base"
  dockerfile_folder: "."
  container_lifespan: "MULTIPLE"
  connection_context: "NONE"
  container_spec:
    root_user: >-
      This distroless base selects the unprivileged user with UID 10000. A
      derivative image may replace that account when its runtime requires a
      different UID or group strategy.
    non_minimized: ""
  mitigations: []
  semgrep:
    exclusions: []
    rule_sets: []
    ignore: []
  clamav:
    false_positives: []
  zap:
    skip_reason: >-
      This image is a base for derivative images and does not contain a
      network service to scan.
    debug: false
    cert_path: ""
    port: 65534
    service_ports: []
